name: Admin panel + web app (GitHub Pages)

# Публикует панель админа (/flyermap/) и веб-версию приложения работника (/flyermap/app/)
on:
  # every merge to main (24.11.2026): the build label in the menu always shows the newest merged PR,
  # also when a PR changed only tests, tools or SQL
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build worker web app
        working-directory: worker
        run: |
          npm install
          npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -R admin/. site/
          rm -f site/.gitignore
          cp -R worker/www site/app
          node worker/scripts/stamp-version.mjs site/index.html
          node worker/scripts/legal-pages.mjs site
          # the release is not published without its build label
          node test/version.mjs site/app/index.html site/index.html
          ls -R site | head -40
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
