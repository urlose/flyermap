name: Time-first planner test
on:
  pull_request:
    paths:
      - 'admin/planner.js'
      - 'worker/src/nearfirst.js'
      - 'worker/src/circlearea.js'
      - 'test/circlearea.mjs'
      - 'worker/src/customerexport.js'
      - 'worker/src/plancore.js'
      - 'worker/src/admin.js'
      - 'worker/src/budgetplan.js'
      - 'worker/src/i18n6.js'
      - 'test/nearfirst.mjs'
      - 'test/fixedrun.mjs'
      - 'test/loehne-*.mjs'
      - 'test/nearfirst-overlap.mjs'
      - 'test/nearfirst-zone-boundary.mjs'
      - 'test/routing-quality.mjs'
      - 'test/leipheim-readonly.mjs'
      - 'test/fixtures/leipheim-2026-11-16.json.gz'
      - 'test/nearfirst-service.mjs'
      - 'test/customerexport.mjs'
      - 'test/budget.mjs'
      - 'supabase/2026-11-16_atomic_task_plans.sql'
      - 'test/sql/atomic_task_plans.sh'
      - 'test/ui/e2e-timefirst.cjs'
      - 'worker/src/flyercap.js'
      - 'worker/src/drivezone.js'
      - 'worker/src/carroute.js'
      - 'test/drivefirst.mjs'
      - 'test/drive-compact.mjs'
      - 'test/drive-shift-limit.mjs'
      - 'test/drive-layout-report.mjs'
      - 'test/leipheim-drive-snapshot.mjs'
      - 'test/fixtures/leipheim-drive-*'
      - 'worker/src/budgetplan.js'
      - 'worker/src/savecounts.js'
      - 'test/save-integers.mjs'
      - 'test/ui/e2e-cap.cjs'
      - 'worker/src/coord.js'
      - 'test/ui/e2e-coord.cjs'
      - '.github/workflows/time-first-check.yml'
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        working-directory: worker
      - run: node test/routing-quality.mjs
      - run: node test/nearfirst-overlap.mjs
      - run: node test/nearfirst-zone-boundary.mjs
      - name: Replay pinned Leipheim snapshot without network
        run: node test/leipheim-readonly.mjs test/fixtures/leipheim-2026-11-16.json.gz
      - name: Offline routing regressions
        run: |
          for suite in drive islands skip must zones census zensus real; do
            node test/$suite.mjs || exit 1
          done
      - run: node test/nearfirst.mjs
      - run: node test/fixedrun.mjs
      - run: node test/loehne-split.mjs   # real Löhne data, saved snapshot, no network
      - run: node test/loehne-fixed.mjs
      - run: node test/nearfirst-service.mjs
      - run: node test/circlearea.mjs
      - run: node test/flyercap.mjs
      - run: node test/drivefirst.mjs
      - run: node test/drive-compact.mjs
      - run: node test/drive-shift-limit.mjs
      - run: node test/leipheim-drive-snapshot.mjs   # real Leipheim data, saved snapshot, no network
        env:
          FLYERMAP_CHECK_REPLAN: 1
      - run: node test/save-integers.mjs
      - run: node test/customerexport.mjs
      - name: Check atomic save on synthetic Postgres
        run: |
          if ! command -v psql >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y postgresql-client; fi
          bash test/sql/atomic_task_plans.sh
      - run: npm run build
        working-directory: worker
      - name: Install Chromium E2E
        working-directory: test/ui
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Browser test (synthetic Supabase, no production)
        working-directory: test/ui
        run: timeout 900s node e2e-timefirst.cjs out-timefirst
      - name: Browser test smaller print run (synthetic, no production)
        working-directory: test/ui
        env:
          CAP_PCT: '0.85'
        run: timeout 900s node e2e-cap.cjs out-timefirst/cap
      - name: Browser test fixed print run Löhne (real map squares, synthetic Supabase)
        working-directory: test/ui
        run: timeout 600s node e2e-fixedrun.cjs out-timefirst/fixedrun
      - name: Browser test coordinator role (synthetic Supabase, no production)
        working-directory: test/ui
        run: timeout 300s node e2e-coord.cjs out-timefirst/coord
      - name: Read-only Leipheim snapshot and offline replay
        run: timeout 240s node test/leipheim-readonly.mjs --capture test/ui/out-timefirst/leipheim.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: time-first-e2e
          path: test/ui/out-timefirst
          retention-days: 4
      - name: Legacy budget regression (offline fixtures)
        run: node test/budget.mjs

