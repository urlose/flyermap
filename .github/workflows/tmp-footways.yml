name: tmp footway census
on:
  push:
    branches: [diag/footways-tmp]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/tmpdiag/footways.mjs
