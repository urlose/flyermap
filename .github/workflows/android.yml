name: Android app (APK)

on:
  push:
    branches: [main]
    paths: ['worker/**', 'admin/planner.js', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install & build web app
        run: |
          npm install
          npm run build
      - name: Create & configure Android project
        run: bash scripts/android-setup.sh
      - name: Build APK
        working-directory: worker/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../FlyerMap.apk
          ls -la ../FlyerMap.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FlyerMap-apk
          path: worker/FlyerMap.apk
      - name: Publish release (download link for Android phones)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: FlyerMap Android ${{ github.run_number }}
          body: FlyerMap.apk auf dem Android-Handy herunterladen und öffnen (Installation aus dieser Quelle erlauben).
          files: worker/FlyerMap.apk
