name: Build label test
on:
  pull_request:
    paths:
      - 'worker/scripts/stamp-version.mjs'
      - 'worker/build.mjs'
      - 'worker/src/app.js'
      - 'worker/src/legalview.js'
      - 'worker/src/index.html'
      - 'admin/index.html'
      - 'test/version.mjs'
      - '.github/workflows/version-check.yml'
      - '.github/workflows/admin.yml'
permissions:
  contents: read
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        working-directory: worker
      - run: npm run build
        working-directory: worker
      - name: Assemble the site like the release does and check the build label
        run: |
          mkdir -p site
          cp -R admin/. site/
          cp -R worker/www site/app
          node worker/scripts/stamp-version.mjs site/index.html
          node test/version.mjs site/app/index.html site/index.html
