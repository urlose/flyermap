name: iOS app (unsigned IPA)

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/ios.yml']
  # SideStore-сборка (без подписи). Для команды используется testflight.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build web app
        run: |
          npm install
          npm run build

      - name: Create & configure iOS project
        run: bash scripts/ios-setup.sh

      - name: Build unsigned app
        working-directory: worker/ios/App
        run: |
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry FlyerMap.ipa Payload
          ls -la FlyerMap.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FlyerMap-ipa
          path: worker/ios/App/FlyerMap.ipa

      - name: Publish release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FlyerMap ${{ github.run_number }}
          body: Скачайте FlyerMap.ipa на iPhone и откройте через SideStore.
          files: worker/ios/App/FlyerMap.ipa
          make_latest: true
