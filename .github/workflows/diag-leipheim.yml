name: Diagnose time-first hours (Leipheim, read-only)
on:
  workflow_dispatch:
  push:
    branches: [feature/timefirst-hours]
    paths: ['test/diag-leipheim.mjs', 'worker/src/plancore.js', 'admin/planner.js', '.github/workflows/diag-leipheim.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node test/diag-leipheim.mjs | tee diag.json
      - uses: actions/upload-artifact@v4
        with: { name: diag-leipheim, path: diag.json }
