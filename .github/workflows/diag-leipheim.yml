name: Diagnose time-first hours (Leipheim, read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node test/diag-leipheim.mjs | tee diag-out.txt
      - uses: actions/upload-artifact@v4
        with: { name: diag-leipheim, path: "diag-out*" }
