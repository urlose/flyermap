name: Record Frankfurt snapshot (read-only public data)
# Westerbachstraße 29, 60489 Frankfurt: 2 people, 10 000 flyers, mode Automatisch. Records every public map request of one
# planner run (tiles, Overpass roads, census files, geocoder) so before/after comparisons run offline on identical data.
on:
  workflow_dispatch:
  push:
    branches: [fix/radial-street-selection]
    paths: ['.github/workflows/record-frankfurt.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Record (up to 3 tries until the public road server answers)
        run: |
          for i in 1 2 3; do node test/plan-compare.mjs frankfurt --record --out /tmp/frankfurt-recorded.json && break; sleep 60; done
          test -f test/fixtures/frankfurt-westerbachstrasse-2026-11-24.json.gz
          ls -la test/fixtures/frankfurt-westerbachstrasse-2026-11-24.json.gz
      - name: Replay offline
        run: node test/plan-compare.mjs frankfurt | head -40
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/fixtures/frankfurt-westerbachstrasse-2026-11-24.json.gz
          git commit -m "Frankfurt snapshot of the public map data (recorded in CI)" && git push
