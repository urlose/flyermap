<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlyerMap Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F3F5F7; --panel:#FFFFFF; --ink:#18212F; --muted:#5D6878; --line:#DCE1E7;
  --route:#C2185B; --zone:#0E9F8E; --live:#2563EB; --warn:#B45309; --danger:#B91C1C;
  --chip:#EEF2F6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161D; --panel:#18202A; --ink:#E6EBF1; --muted:#9AA6B5; --line:#2A3542;
    --chip:#222C38; --route:#F06292; --zone:#2DD4BF; --live:#60A5FA;
  }
}
:root[data-theme="dark"]{
  --bg:#11161D; --panel:#18202A; --ink:#E6EBF1; --muted:#9AA6B5; --line:#2A3542;
  --chip:#222C38; --route:#F06292; --zone:#2DD4BF; --live:#60A5FA;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.hidden{display:none!important}

/* auth */
#auth{min-height:100%;display:grid;place-items:center;padding:16px}
.authbox{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.authbox h1{font-size:22px;margin:0 0 4px}
.authbox p{color:var(--muted);margin:0 0 18px}

/* layout */
#app{display:grid;grid-template-columns:400px 1fr;height:100%}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#map{height:100%;min-height:300px}
header.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
header.top b{font-size:17px}
header.top .me{margin-left:auto;color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 10px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
#view{padding:14px 16px 24px;overflow:auto;flex:1;min-height:0}

h2{font-size:16px;margin:4px 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
textarea{min-height:60px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;text-decoration:none;color:var(--ink);display:inline-block}
.btn.pri{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:500}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}
.small{font-size:13px}
.err{color:var(--danger);font-size:13px;margin-top:8px}

.item{padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item.click{cursor:pointer}
.item.click:hover .t{text-decoration:underline}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.results{border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:220px;overflow:auto}
.results div{padding:8px 10px;cursor:pointer;font-size:14px}
.results div:hover{background:var(--chip)}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}
.stat div span{display:block;font-size:12px;color:var(--muted)}
.stat div b{font-size:17px}
.back{background:none;border:0;padding:0;color:var(--muted);margin-bottom:8px}
.hint{background:var(--chip);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}

.leaflet-container{background:var(--bg)}
.pin-live{background:var(--live);border:3px solid #fff;border-radius:50%;width:18px;height:18px;box-shadow:0 0 0 2px var(--live)}
.pin-start{background:var(--zone);border:3px solid #fff;border-radius:50%;width:20px;height:20px;box-shadow:0 0 0 2px var(--zone)}

@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:45vh 1fr}
  header.top .me{display:none}
  header.top button{margin-left:auto}
  #map{order:-1;height:45vh}
  #side{border-right:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>

<section id="auth" class="hidden">
  <div class="authbox">
    <h1>FlyerMap</h1>
    <p>Панель администратора</p>
    <label class="f" for="aEmail">Email</label>
    <input id="aEmail" type="email" autocomplete="username">
    <label class="f" for="aPass">Пароль</label>
    <input id="aPass" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:16px">
      <button class="btn pri grow" id="bLogin">Войти</button>
      <button class="btn" id="bSignup">Создать аккаунт</button>
    </div>
    <div id="aErr" class="err"></div>
  </div>
</section>

<section id="noaccess" class="hidden" style="padding:40px;text-align:center">
  <h2>Нет доступа</h2>
  <p class="muted">Этот аккаунт не является админом. Попросите существующего админа пригласить ваш email во вкладке «Админы», затем войдите снова.</p>
  <button class="btn" onclick="logout()">Выйти</button>
</section>

<div id="app" class="hidden">
  <aside id="side">
    <header class="top"><b>FlyerMap</b><span class="me" id="meEmail"></span><button class="btn sm" onclick="logout()">Выйти</button></header>
    <nav class="tabs" id="tabs">
      <button data-t="live" class="on">Сейчас</button>
      <button data-t="tasks">Задания</button>
      <button data-t="workers">Работники</button>
      <button data-t="routes">Маршруты</button>
      <button data-t="admins">Админы</button>
    </nav>
    <div id="view"></div>
  </aside>
  <div id="map"></div>
</div>

<script>
const SB_URL = 'https://xobrvfkwqessbkdwiavu.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvYnJ2Zmt3cWVzc2JrZHdpYXZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NzA4NTQsImV4cCI6MjEwODI0Njg1NH0.5AvLRyZaiqpYQV_O47o7MNO8kg7BEZdiU4-WYSPuNBM';
const sb = supabase.createClient(SB_URL, SB_KEY);
const KM_PER_MIN_TRANSIT = 0.75;   // ~45 км за час на S-Bahn/RE
const WALK_M_PER_MIN = 83;          // ~5 км/ч

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S = { tab:'live', workers:[], tasks:[], poll:null, draft:null };

/* ---------- geo helpers ---------- */
function hav(a,b,c,d){const R=6371,r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
const fmtKm = m => m>=1000 ? (m/1000).toFixed(2).replace('.',',')+' км' : Math.round(m)+' м';
function fmtDur(a,b){ if(!a) return '—'; const ms=(b?new Date(b):new Date())-new Date(a); const h=Math.floor(ms/3.6e6), m=Math.round(ms%3.6e6/6e4); return h? `${h} ч ${m} мин`:`${m} мин`; }
const fmtDT = d => d ? new Date(d).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
const fmtD = d => d ? new Date(d).toLocaleDateString('ru-RU') : '—';
const ago = d => { if(!d) return 'нет данных'; const s=(Date.now()-new Date(d))/1000; if(s<90) return 'только что'; if(s<3600) return Math.round(s/60)+' мин назад'; if(s<86400) return Math.round(s/3600)+' ч назад'; return fmtD(d); };

async function geocode(q){
  const u = 'https://nominatim.openstreetmap.org/search?format=json&limit=6&addressdetails=1&accept-language=de,ru&q='+encodeURIComponent(q);
  const r = await fetch(u); if(!r.ok) throw new Error('Поиск недоступен');
  return (await r.json()).map(x => ({
    name: x.address?.city || x.address?.town || x.address?.village || x.address?.municipality || x.name || x.display_name.split(',')[0],
    label: x.display_name, lat:+x.lat, lng:+x.lon }));
}
function circlePoly(lat,lng,meters,n=48){const o=[];for(let i=0;i<n;i++){const a=i/n*2*Math.PI;o.push([lat+meters/111320*Math.cos(a),lng+meters/(111320*Math.cos(lat*Math.PI/180))*Math.sin(a)]);}return o;}
async function isochrone(lat,lng,min){
  try{
    const q = {locations:[{lat,lon:lng}],costing:'pedestrian',contours:[{time:min}],polygons:true,denoise:0.5,generalize:30};
    const ctrl = new AbortController(); setTimeout(()=>ctrl.abort(),12000);
    const r = await fetch('https://valhalla1.openstreetmap.de/isochrone?json='+encodeURIComponent(JSON.stringify(q)),{signal:ctrl.signal});
    if(!r.ok) throw 0;
    const g = await r.json(); let c = g.features[0].geometry.coordinates;
    if(g.features[0].geometry.type==='MultiPolygon') c = c[0];
    return {poly:c[0].map(([x,y])=>[y,x]), real:true};
  }catch(e){ return {poly:circlePoly(lat,lng,min*WALK_M_PER_MIN), real:false}; }
}
function waLink(phone,text){ let d=String(phone||'').replace(/[^0-9+]/g,''); if(d.startsWith('+')) d=d.slice(1); else if(d.startsWith('00')) d=d.slice(2); else if(d.startsWith('0')) d='49'+d.slice(1); return 'https://wa.me/'+d+(text?'?text='+encodeURIComponent(text):''); }
const telLink = p => 'tel:'+String(p||'').replace(/[^0-9+]/g,'');
function workerZoneKm(w){ return (w.zone_minutes||60)*KM_PER_MIN_TRANSIT; }
function workerDistTo(w,lat,lng){ let best=Infinity, city=null; for(const c of (w.cities||[])){ const d=hav(c.lat,c.lng,lat,lng); if(d<best){best=d;city=c;} } return {km:best, city}; }
function workersForPoint(lat,lng){
  return S.workers.map(w=>({w,...workerDistTo(w,lat,lng)}))
    .map(x=>({...x, inZone: x.km<=workerZoneKm(x.w)})).sort((a,b)=>a.km-b.km);
}

/* ---------- map ---------- */
let map, L1, L2;
function initMap(){
  if(map) return;
  map = L.map('map',{zoomControl:true}).setView([51.2277,6.7735],11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  L1 = L.layerGroup().addTo(map); // context layer
  L2 = L.layerGroup().addTo(map); // live layer
  map.on('click', e => { if(S.onMapClick) S.onMapClick(e.latlng); });
}
const icon = cls => L.divIcon({className:'',html:`<div class="${cls}"></div>`,iconSize:[22,22],iconAnchor:[11,11]});
function drawZone(poly, layer=L1){ return L.polygon(poly,{color:css('--zone'),weight:2,fillOpacity:.12}).addTo(layer); }
function drawLine(pts, layer=L1, color){ return L.polyline(pts,{color:color||css('--route'),weight:4,opacity:.85}).addTo(layer); }
function fit(bounds){ try{ if(bounds && bounds.isValid()) map.fitBounds(bounds,{padding:[30,30],maxZoom:17}); }catch(e){} }

/* ---------- data ---------- */
async function loadWorkers(){ const {data,error}=await sb.from('workers').select('id,name,phone,cities,zone_minutes,notes,last_lat,last_lng,last_seen,active_route_id,created_at').order('name'); if(error) throw error; S.workers=data; }
async function loadTasks(){ const {data,error}=await sb.from('tasks').select('*,task_workers(worker_id)').order('created_at',{ascending:false}); if(error) throw error; S.tasks=data; }
async function fetchPoints(routeId){
  let all=[], from=0;
  while(true){
    const {data,error}=await sb.from('route_points').select('t,lat,lng').eq('route_id',routeId).order('t').range(from,from+999);
    if(error) throw error; all=all.concat(data); if(data.length<1000) break; from+=1000;
  }
  return all;
}
const wName = id => S.workers.find(w=>w.id===id)?.name || '—';

/* ---------- auth ---------- */
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ show('auth'); return; }
  const {data:ok,error} = await sb.rpc('become_admin');
  if(error || !ok){ show('noaccess'); return; }
  $('#meEmail').textContent = session.user.email;
  show('app'); initMap(); setTimeout(()=>map.invalidateSize(),50);
  try{ await Promise.all([loadWorkers(),loadTasks()]); }catch(e){ alert('Ошибка загрузки: '+e.message); }
  go('live');
}
function show(id){ ['auth','noaccess','app'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id)); }
async function logout(){ await sb.auth.signOut(); location.reload(); }
$('#bLogin').onclick = async()=>{ $('#aErr').textContent=''; const {error}=await sb.auth.signInWithPassword({email:$('#aEmail').value.trim(),password:$('#aPass').value}); if(error) $('#aErr').textContent=error.message==='Invalid login credentials'?'Неверный email или пароль':error.message; else boot(); };
$('#bSignup').onclick = async()=>{ $('#aErr').textContent=''; const p=$('#aPass').value; if(p.length<8){$('#aErr').textContent='Пароль — минимум 8 символов';return;} const {data,error}=await sb.auth.signUp({email:$('#aEmail').value.trim(),password:p}); if(error){$('#aErr').textContent=error.message;return;} if(data.session) return boot(); const r=await sb.auth.signInWithPassword({email:$('#aEmail').value.trim(),password:p}); if(!r.error) boot(); else $('#aErr').textContent='Аккаунт создан. Подтвердите email по ссылке из письма и войдите.'; };
$('#aPass').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#bLogin').click(); });

/* ---------- navigation ---------- */
$('#tabs').onclick = e => { const t=e.target.closest('button')?.dataset.t; if(t) go(t); };
function go(tab, arg){
  S.tab=tab; S.onMapClick=null; clearInterval(S.poll); $('#view').onclick=null; L1.clearLayers(); L2.clearLayers();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  ({live:viewLive, tasks:viewTasks, task:viewTask, newtask:viewNewTask, workers:viewWorkers, worker:viewWorker, routes:viewRoutes, route:viewRoute, admins:viewAdmins})[tab](arg);
}
const V = html => { $('#view').innerHTML = html; };

/* ---------- LIVE ---------- */
async function viewLive(){
  V(`<h2>Кто сейчас на маршруте</h2><div id="liveList" class="muted">Загрузка…</div>`);
  const tick = async()=>{
    try{ await loadWorkers(); }catch(e){ return; }
    L2.clearLayers();
    const active = S.workers.filter(w=>w.active_route_id && w.last_seen && Date.now()-new Date(w.last_seen)<20*60e3);
    const b = L.latLngBounds([]);
    for(const w of active){
      L.marker([w.last_lat,w.last_lng],{icon:icon('pin-live')}).bindTooltip(esc(w.name),{permanent:true,direction:'top',offset:[0,-10]}).addTo(L2);
      b.extend([w.last_lat,w.last_lng]);
      try{ const pts=await fetchPoints(w.active_route_id); if(pts.length>1){ drawLine(pts.map(p=>[p.lat,p.lng]),L2); } }catch(e){}
    }
    const el = $('#liveList'); if(!el) return;
    el.classList.remove('muted');
    el.innerHTML = active.length ? active.map(w=>`
      <div class="item"><div class="t"><span class="dot" style="background:var(--live)"></span>${esc(w.name)}</div>
      <div class="small muted">Обновлено ${ago(w.last_seen)}</div>
      <div class="row" style="margin-top:6px"><button class="btn sm" onclick="map.setView([${w.last_lat},${w.last_lng}],16)">Показать</button>
      <a class="btn sm" href="${telLink(w.phone)}">Позвонить</a><a class="btn sm" target="_blank" href="${waLink(w.phone)}">WhatsApp</a></div></div>`).join('')
      : `<p class="muted">Сейчас никто не на маршруте. Когда работник нажмёт «Старт» в приложении, он появится здесь и на карте.</p>`;
    if(!S.liveFitted && active.length){ fit(b); S.liveFitted=true; }
  };
  S.liveFitted=false; await tick(); S.poll=setInterval(tick,15000);
}

/* ---------- TASKS ---------- */
function viewTasks(){
  const open = S.tasks.filter(t=>t.status==='open'), done = S.tasks.filter(t=>t.status!=='open');
  const row = t => `<div class="item click" onclick="go('task','${t.id}')"><div class="t">${esc(t.title)}</div>
    <div class="small muted">${esc(t.city_name||'')} · ${t.work_date?fmtD(t.work_date):'без даты'} · ${t.task_workers.length} чел.</div></div>`;
  V(`<div class="row"><h2 class="grow">Задания</h2><button class="btn pri" onclick="go('newtask')">Новое задание</button></div>
    ${open.length? open.map(row).join('') : '<p class="muted">Открытых заданий нет. Создайте задание: выберите город и точку старта на карте.</p>'}
    ${done.length? `<h2 style="margin-top:20px">Завершённые</h2>`+done.map(row).join(''):''}`);
  const b=L.latLngBounds([]);
  for(const t of open){ if(t.zone_polygon) drawZone(t.zone_polygon); L.marker([t.start_lat,t.start_lng],{icon:icon('pin-start')}).bindTooltip(esc(t.title)).on('click',()=>go('task',t.id)).addTo(L1); b.extend([t.start_lat,t.start_lng]); }
  fit(b);
}

function citySearchWidget(id, onPick, placeholder='Город, например Düsseldorf'){
  setTimeout(()=>{
    const inp=$('#'+id), res=$('#'+id+'R'); let tmr;
    inp.addEventListener('input',()=>{ clearTimeout(tmr); const q=inp.value.trim(); if(q.length<2){res.innerHTML='';res.classList.add('hidden');return;}
      tmr=setTimeout(async()=>{ try{ const r=await geocode(q); res.classList.remove('hidden');
        res.innerHTML = r.length? r.map((x,i)=>`<div data-i="${i}">${esc(x.label)}</div>`).join('') : '<div class="muted">Ничего не найдено</div>';
        res.onclick=e=>{ const i=e.target.dataset.i; if(i==null) return; res.classList.add('hidden'); inp.value=r[i].name; onPick(r[i]); };
      }catch(e){ res.innerHTML='<div class="muted">Поиск недоступен</div>'; } },400); });
  });
  return `<input type="text" id="${id}" placeholder="${placeholder}" autocomplete="off"><div id="${id}R" class="results hidden"></div>`;
}

function viewNewTask(){
  const d = S.draft = {city:null, start:null, minutes:15, poly:null, real:false, picked:new Set(), showAll:false};
  V(`<button class="back" onclick="go('tasks')">← Задания</button><h2>Новое задание</h2>
    <label class="f">Город</label>${citySearchWidget('ntCity', c=>{ d.city=c; map.setView([c.lat,c.lng],14); $('#ntTitle').value ||= c.name; })}
    <div class="hint" id="ntHint">Нажмите на карту, чтобы поставить точку старта.</div>
    <div class="row"><div class="grow"><label class="f">Минут пешком от старта</label><input type="number" id="ntMin" min="5" max="60" value="15"></div>
      <div class="grow"><label class="f">Дата</label><input type="date" id="ntDate"></div></div>
    <label class="f">Название</label><input type="text" id="ntTitle" placeholder="Например: Düsseldorf Bilk">
    <label class="f">Заметка для работников</label><textarea id="ntNotes" placeholder="Что раздавать, сколько штук, где забрать флаеры"></textarea>
    <h2 style="margin-top:18px">Работники</h2><div id="ntWorkers" class="muted small">Сначала поставьте точку старта — покажу, у кого она в зоне.</div>
    <div class="row" style="margin-top:16px"><button class="btn pri grow" id="ntSave" disabled>Сохранить задание</button></div><div id="ntErr" class="err"></div>`);
  const redraw = async()=>{
    if(!d.start) return; L1.clearLayers();
    $('#ntHint').textContent='Строю зону по улицам…';
    const r = await isochrone(d.start.lat,d.start.lng,d.minutes); d.poly=r.poly; d.real=r.real;
    L1.clearLayers(); drawZone(d.poly); L.marker([d.start.lat,d.start.lng],{icon:icon('pin-start')}).addTo(L1);
    fit(L.polygon(d.poly).getBounds());
    $('#ntHint').textContent = r.real ? `Зона: куда можно дойти за ${d.minutes} мин по улицам. Нажмите на карту ещё раз, чтобы перенести старт.` : `Сервис расчёта по улицам не ответил — показан круг ~${fmtKm(d.minutes*WALK_M_PER_MIN)}.`;

  };

    const list = workersForPoint(d.start.lat,d.start.lng).filter(x=>d.showAll||x.inZone);

    $('#ntWorkers').innerHTML = (list.length? list.map(x=>`<label class="item row" style="cursor:pointer"><input type="checkbox" data-id="${x.w.id}" ${d.picked.has(x.w.id)?'checked':''}>

      : '<p class="muted">В зоне этой точки нет работников.</p>') +
      `<button class="btn sm" style="margin-top:8px" onclick="S.draft.showAll=!S.draft.showAll;this.parentNode.dispatchEvent(new Event('rerender'))">${d.showAll?'Только в зоне':'Показать всех'}</button>`;
  };
  $('#ntWorkers').addEventListener('change',e=>{ const id=e.target.dataset.id; if(!id) return; e.target.checked?d.picked.add(id):d.picked.delete(id); });
  $('#ntWorkers').addEventListener('rerender',renderPick);
  S.onMapClick = ll => { d.start={lat:ll.lat,lng:ll.lng}; redraw(); };
  $('#ntMin').onchange = e => { d.minutes=Math.max(5,Math.min(60,+e.target.value||15)); redraw(); };
  $('#ntSave').onclick = async()=>{
    const title=$('#ntTitle').value.trim(); if(!title){$('#ntErr').textContent='Укажите название';return;}
    $('#ntSave').disabled=true;
    const {data:u}=await sb.auth.getUser();
    const {data:t,error}=await sb.from('tasks').insert({title, city_name:d.city?.name||null, start_lat:d.start.lat, start_lng:d.start.lng, walk_minutes:d.minutes, zone_polygon:d.poly, work_date:$('#ntDate').value||null, notes:$('#ntNotes').value.trim()||null, created_by:u.user.id}).select().single();
    if(error){$('#ntErr').textContent=error.message;$('#ntSave').disabled=false;return;}
    if(d.picked.size){ const {error:e2}=await sb.from('task_workers').insert([...d.picked].map(w=>({task_id:t.id,worker_id:w}))); if(e2) alert(e2.message); }
    await loadTasks(); go('task',t.id);
  };
}

/* ---------- export ---------- */
const slug = s => String(s).replace(/[^\p{L}\p{N}]+/gu,'_').slice(0,60);
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }

function exportXLS(title, lines){
  const sum = lines.map(({r,pts})=>({'Работник':wName(r.worker_id),'Начало':fmtDT(r.started_at),'Конец':r.ended_at?fmtDT(r.ended_at):'','Длительность':fmtDur(r.started_at,r.ended_at),'Км':+(r.distance_m/1000).toFixed(2),'GPS-точек':pts.length}));
  const pts = lines.flatMap(({r,pts})=>pts.map(p=>({'Работник':wName(r.worker_id),'Время':fmtDT(p.t),'Широта':p.lat,'Долгота':p.lng})));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sum), 'Сводка');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pts), 'GPS-точки');
  XLSX.writeFile(wb, slug(title)+'.xlsx');
}

// карта для PDF: рисуем тайлы OSM и маршрут на canvas
async function renderMapCanvas(lines, task, W, H){
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d');
  g.fillStyle='#f2f2f2'; g.fillRect(0,0,W,H);
  const all=[]; lines.forEach(l=>l.pts.forEach(p=>all.push([p.lat,p.lng]))); if(task?.zone_polygon) all.push(...task.zone_polygon); if(task) all.push([task.start_lat,task.start_lng]);
  if(!all.length) return {cv,ok:false};
  const X=(lng,z)=>(lng+180)/360*256*2**z, Y=(lat,z)=>{const r=lat*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*256*2**z;};
  let z=18; const lats=all.map(p=>p[0]), lngs=all.map(p=>p[1]);
  const [mnLa,mxLa,mnLo,mxLo]=[Math.min(...lats),Math.max(...lats),Math.min(...lngs),Math.max(...lngs)];
  while(z>3 && (X(mxLo,z)-X(mnLo,z)>W-60 || Y(mnLa,z)-Y(mxLa,z)>H-60)) z--;
  const cx=(X(mnLo,z)+X(mxLo,z))/2, cy=(Y(mxLa,z)+Y(mnLa,z))/2, ox=cx-W/2, oy=cy-H/2;
  let ok=true; const jobs=[];
  for(let tx=Math.floor(ox/256); tx<=Math.floor((ox+W)/256); tx++) for(let ty=Math.floor(oy/256); ty<=Math.floor((oy+H)/256); ty++){
    jobs.push(new Promise(res=>{ const im=new Image(); im.crossOrigin='anonymous'; const t=setTimeout(()=>{ok=false;res();},8000);
      im.onload=()=>{clearTimeout(t); g.drawImage(im,tx*256-ox,ty*256-oy); res();}; im.onerror=()=>{clearTimeout(t); ok=false; res();};
      im.src=`https://tile.openstreetmap.org/${z}/${tx}/${ty}.png`; }));
  }
  await Promise.all(jobs);
  const P=([la,lo])=>[X(lo,z)-ox,Y(la,z)-oy];
  if(task?.zone_polygon){ g.beginPath(); task.zone_polygon.forEach((p,i)=>{const [x,y]=P(p); i?g.lineTo(x,y):g.moveTo(x,y);}); g.closePath(); g.fillStyle='rgba(14,159,142,.15)'; g.fill(); g.strokeStyle='#0E9F8E'; g.lineWidth=3; g.stroke(); }
  const colors=['#C2185B','#1E40AF','#B45309','#6D28D9','#047857'];
  lines.forEach((l,i)=>{ if(l.pts.length<2) return; g.beginPath(); l.pts.forEach((p,j)=>{const [x,y]=P([p.lat,p.lng]); j?g.lineTo(x,y):g.moveTo(x,y);}); g.strokeStyle=colors[i%colors.length]; g.lineWidth=5; g.lineJoin='round'; g.globalAlpha=.85; g.stroke(); g.globalAlpha=1; });
  if(task){ const [x,y]=P([task.start_lat,task.start_lng]); g.beginPath(); g.arc(x,y,9,0,7); g.fillStyle='#0E9F8E'; g.fill(); g.lineWidth=3; g.strokeStyle='#fff'; g.stroke(); }
  return {cv,ok};
}
async function exportPDF(title, meta, lines, task){
  // страница A4 рисуется на canvas (поддержка кириллицы), затем кладётся в PDF
  const W=1240, H=1754, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,W,H); g.fillStyle='#18212F';
  g.font='600 44px "IBM Plex Sans",sans-serif'; g.fillText(title.slice(0,48),80,120);
  g.font='24px "IBM Plex Sans",sans-serif'; g.fillStyle='#5D6878'; g.fillText('Отчёт о раздаче · создан '+fmtDT(new Date()),80,165);
  let y=230; g.font='26px "IBM Plex Sans",sans-serif';
  for(const [k,v] of meta){ g.fillStyle='#5D6878'; g.fillText(k,80,y); g.fillStyle='#18212F'; g.fillText(String(v),420,y); y+=42; }
  const {cv:mc,ok} = await renderMapCanvas(lines, task, 1080, 900);
  y+=20; g.drawImage(mc,80,y); g.strokeStyle='#DCE1E7'; g.lineWidth=2; g.strokeRect(80,y,1080,900); y+=930;
  g.font='18px "IBM Plex Sans",sans-serif'; g.fillStyle='#5D6878';
  g.fillText(ok?'Карта © OpenStreetMap contributors':'Карту улиц загрузить не удалось — показан только пройденный маршрут.',80,y); y+=50;
  if(lines.length>1){ g.font='22px "IBM Plex Sans",sans-serif'; const colors=['#C2185B','#1E40AF','#B45309','#6D28D9','#047857'];
    lines.slice(0,12).forEach((l,i)=>{ g.fillStyle=colors[i%colors.length]; g.fillRect(80,y-16,30,8); g.fillStyle='#18212F'; g.fillText(`${wName(l.r.worker_id)} — ${fmtDT(l.r.started_at)}, ${fmtDur(l.r.started_at,l.r.ended_at)}, ${fmtKm(l.r.distance_m)}`,125,y); y+=36; }); }
  const pdf = new jspdf.jsPDF({unit:'mm',format:'a4'}); pdf.addImage(cv.toDataURL('image/jpeg',.9),'JPEG',0,0,210,297); pdf.save(slug(title)+'.pdf');
}
