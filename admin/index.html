<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlyerMap</title>
<link rel="icon" href="app/icon.png">
<style>
:root{--bg:#F2F4F6;--card:#fff;--ink:#17202B;--muted:#5F6B7A;--line:#E1E5EA;--brand:#0E9F8E}
@media (prefers-color-scheme:dark){:root{--bg:#0F141A;--card:#19212B;--ink:#E8EDF2;--muted:#9AA6B4;--line:#2A3441;--brand:#2CC9B5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
main{max-width:460px;margin:0 auto;padding:40px 20px}img{width:72px;height:72px;border-radius:18px}h1{margin:16px 0 4px;font-size:30px}p{color:var(--muted)}
a.b{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;text-decoration:none;color:var(--ink);font-weight:650}
a.b.p{background:var(--brand);border-color:var(--brand);color:#fff}a.b small{display:block;font-weight:400;color:inherit;opacity:.8}
a.b:not(.p) small{color:var(--muted);opacity:1}
</style>
</head>
<body><main>
<img src="app/icon.png" alt=""><h1>FlyerMap</h1>
<p>Interne App für das Verteiler-Team · Внутреннее приложение команды</p>
<a class="b p" href="app/">Web-App öffnen<small>Öffnen в браузере · Auf jedem Gerät</small></a>
<a class="b" href="https://github.com/urlose/flyermap/releases">Android &amp; iPhone installieren<small>Neueste „FlyerMap Android“ (APK) bzw. iPhone-IPA · последняя версия</small></a>
<p style="font-size:13px"><a href="privacy.html" style="color:inherit">Datenschutz</a></p>
</main></body></html>
