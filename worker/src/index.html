<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>FlyerMap</title>
<link rel="stylesheet" href="leaflet.css">
<style>
:root{
  --bg:#F3F5F7; --panel:#FFFFFF; --ink:#18212F; --muted:#5D6878; --line:#DCE1E7; --chip:#EEF2F6;
  --zone:#0E9F8E; --route:#C2185B; --live:#2563EB; --danger:#B91C1C; --ok:#047857;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#11161D; --panel:#18202A; --ink:#E6EBF1; --muted:#9AA6B5; --line:#2A3542; --chip:#222C38;
         --zone:#2DD4BF; --route:#F06292; --live:#60A5FA; --ok:#34D399; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
input,button,textarea{font:inherit;color:inherit}
input{-webkit-user-select:text;user-select:text}
button{cursor:pointer}
.hidden{display:none!important}

#screen{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 18px) 18px calc(var(--sb) + 24px)}
.narrow{max-width:460px;margin:0 auto}

h1{font-size:28px;line-height:1.15;margin:10px 0 6px;letter-spacing:-.01em}
h2{font-size:19px;margin:22px 0 10px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.err{color:var(--danger);font-size:15px;min-height:22px;margin-top:10px}

label.f{display:block;font-size:14px;color:var(--muted);margin:16px 0 6px}
input.in{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:17px}
input.in:focus{outline:2px solid var(--live);border-color:transparent}
.pin{letter-spacing:.5em;text-align:center;font-size:22px}

.btn{display:block;width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:17px;text-align:center;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.go{background:var(--zone);border-color:var(--zone);color:#fff}
.btn.stop{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.5}
.btn+.btn{margin-top:10px}
.link{background:none;border:0;color:var(--live);padding:8px 0;font-size:16px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:20px;padding:6px 8px 6px 12px;font-size:15px}
.chip button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
.results{border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden;background:var(--panel)}
.results div{padding:12px 14px;border-bottom:1px solid var(--line)}
.results div:last-child{border-bottom:0}
.results div:active{background:var(--chip)}

.topbar{display:flex;align-items:center;gap:10px}
.topbar .grow{flex:1;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;font-size:15px}

.task{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
.task .t{font-weight:650;font-size:18px}
.task .d{color:var(--muted);font-size:14px;margin-top:2px}
.task .n{margin-top:8px;font-size:15px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:18px;color:var(--muted)}

/* map screens */
.mapwrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}
.back{position:absolute;z-index:500;top:calc(var(--st) + 12px);left:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sheet{background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;margin-top:-20px;position:relative;z-index:600;padding:18px 18px calc(var(--sb) + 16px);box-shadow:0 -4px 18px rgba(0,0,0,.08)}
.sheet h2{margin:0 0 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 0 14px}
.legend i{display:inline-block;width:18px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stats div{flex:1;background:var(--chip);border-radius:14px;padding:10px 12px}
.stats span{display:block;font-size:13px;color:var(--muted)}
.stats b{font-size:24px;font-variant-numeric:tabular-nums}
.rec{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--danger)}
.rec::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.rec::before{animation:none}}
.sync{font-size:13px;color:var(--muted);margin-top:10px;text-align:center}

.me-dot{width:18px;height:18px;border-radius:50%;background:var(--live);border:3px solid #fff;box-shadow:0 0 0 2px var(--live),0 0 0 8px rgba(37,99,235,.18)}
.start-dot{width:20px;height:20px;border-radius:50%;background:var(--zone);border:3px solid #fff;box-shadow:0 0 0 2px var(--zone)}
.leaflet-control-attribution{font-size:10px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--panel);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 18px calc(var(--sb) + 18px)}
.modal h2{margin-top:0}
</style>
</head>
<body>
<div id="screen"></div>
<script src="app.js"></script>
</body>
</html>
