@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-ext-wght-normal.woff2) format("woff2-variations"),url(fonts/inter-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-cyrillic-wght-normal.woff2) format("woff2-variations"),url(fonts/inter-cyrillic-wght-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-cyrillic-ext-wght-normal.woff2) format("woff2-variations"),url(fonts/inter-cyrillic-ext-wght-normal.woff2) format("woff2");unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F}
:root{
  color-scheme:light;
  /* brand */
  --blue-50:#EFF6FF; --blue-100:#DBEAFE; --blue-200:#BFDBFE; --blue-400:#60A5FA; --blue-500:#3B82F6; --blue-600:#2563EB; --blue-700:#1D4ED8; --blue-800:#1E40AF; --blue-900:#1E3A8A;
  /* semantic */
  --color-primary:#2563EB; --color-primary-hover:#1D4ED8; --color-primary-soft:#EFF6FF; --color-on-primary:#FFFFFF; --color-on-danger:#FFFFFF;
  --color-bg:#F8FAFC; --color-surface:#FFFFFF; --color-surface-elevated:#FFFFFF; --color-surface-subtle:#F1F5F9;
  --color-text:#0F172A; --color-text-secondary:#64748B; --color-text-disabled:#94A3B8;
  --color-border:#E2E8F0; --color-border-strong:#CBD5E1;
  --color-success:#15803D; --color-success-bg:#F0FDF4; --color-warning:#B45309; --color-warning-bg:#FFFBEB;
  --color-danger:#B91C1C; --color-danger-bg:#FEF2F2; --color-info:#1D4ED8; --color-info-bg:#EFF6FF;
  --color-scrim:rgba(15,23,42,.48);
  --shadow-sm:0 1px 2px rgba(15,23,42,.05); --shadow-md:0 4px 16px rgba(15,23,42,.10); --shadow-lg:0 10px 32px rgba(15,23,42,.16);
  --map-filter:none;
  /* scale */
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:20px; --radius-full:999px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --control-height:48px; --touch-target:44px; --nav-height:68px; --page-pad:16px;
  --font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --dur:180ms; --ease:cubic-bezier(.2,.7,.2,1);
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom); --tabh:var(--nav-height);
  /* aliases used by the scripts */
  --bg:var(--color-bg); --card:var(--color-surface); --ink:var(--color-text); --muted:var(--color-text-secondary); --line:var(--color-border); --soft:var(--color-surface-subtle);
  --brand:var(--color-primary); --brand-ink:var(--color-on-primary); --live:var(--color-primary); --green:#16A34A; --danger:var(--color-danger); --route:#DB2777;
  --shadow:var(--shadow-md);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --color-primary:#60A5FA; --color-primary-hover:#93C5FD; --color-primary-soft:#172A46; --color-on-primary:#0B1220; --color-on-danger:#1F0A0D;
  --color-bg:#0B1220; --color-surface:#111B2B; --color-surface-elevated:#192538; --color-surface-subtle:#202D40;
  --color-text:#F1F5F9; --color-text-secondary:#A3B1C4; --color-text-disabled:#64748B; --color-border:#29364A; --color-border-strong:#40516A;
  --color-success:#4ADE80; --color-success-bg:#14291D; --color-warning:#FBBF24; --color-warning-bg:#33250F; --color-danger:#F87171; --color-danger-bg:#351A20; --color-info:#60A5FA; --color-info-bg:#172A46;
  --color-scrim:rgba(0,0,0,.6); --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 16px rgba(0,0,0,.4); --shadow-lg:0 10px 32px rgba(0,0,0,.55);
  --green:#22C55E; --route:#F472B6; --map-filter:invert(1) hue-rotate(185deg) brightness(.92) contrast(.88) saturate(.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --color-primary:#60A5FA; --color-primary-hover:#93C5FD; --color-primary-soft:#172A46; --color-on-primary:#0B1220; --color-on-danger:#1F0A0D;
    --color-bg:#0B1220; --color-surface:#111B2B; --color-surface-elevated:#192538; --color-surface-subtle:#202D40;
    --color-text:#F1F5F9; --color-text-secondary:#A3B1C4; --color-text-disabled:#64748B; --color-border:#29364A; --color-border-strong:#40516A;
    --color-success:#4ADE80; --color-success-bg:#14291D; --color-warning:#FBBF24; --color-warning-bg:#33250F; --color-danger:#F87171; --color-danger-bg:#351A20; --color-info:#60A5FA; --color-info-bg:#172A46;
    --color-scrim:rgba(0,0,0,.6); --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 16px rgba(0,0,0,.4); --shadow-lg:0 10px 32px rgba(0,0,0,.55);
    --green:#22C55E; --route:#F472B6; --map-filter:invert(1) hue-rotate(185deg) brightness(.92) contrast(.88) saturate(.55);
  }
}
@media (min-width:400px){ :root{ --page-pad:20px; } }

/* ---------- base ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--color-bg)}
body{color:var(--color-text);font:400 16px/24px var(--font-family);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;font-feature-settings:"cv11","ss01"}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
button{cursor:pointer}
a{color:var(--color-primary)}
.hidden,[hidden]{display:none!important}   /* components set display, the hidden attribute must still win */
#root{position:fixed;inset:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
svg{flex:none}
/* typography */
.t-display{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em}
h1,.t-h1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.02em}
h2,.t-h2{font-size:22px;line-height:28px;font-weight:650;letter-spacing:-.01em}
h3,.t-h3{font-size:18px;line-height:24px;font-weight:600}
.t-caption,.small{font-size:13px;line-height:18px}
.muted{color:var(--color-text-secondary)} .center{text-align:center}
.tabnum{font-variant-numeric:tabular-nums}

/* ---------- plain screens (welcome / auth) ---------- */
.plain{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--color-bg)}
.plain-in{max-width:460px;margin:0 auto;padding:calc(var(--st) + 24px) var(--page-pad) calc(var(--sb) + 28px)}
.welcome{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center}
.logo img{width:64px;height:64px;border-radius:var(--radius-lg);display:block;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.hero{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em;margin:4px 0 8px}
.back-link{padding:6px 0;margin-bottom:6px}
.welcome>.muted{margin:0 0 8px}

/* ---------- shell with tab bar ---------- */
.shell{position:absolute;inset:0;display:flex;flex-direction:column}
.content{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;overscroll-behavior:contain}
.content.map-content{overflow:hidden}
.tabbar{display:flex;background:var(--color-surface);border-top:1px solid var(--color-border);padding-bottom:var(--sb);position:relative;z-index:900}
.tab{flex:1;min-width:0;height:var(--tabh);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--color-text-secondary);font-size:12px;line-height:16px;font-weight:500;position:relative;padding:0 4px}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.tab::before{content:"";position:absolute;top:9px;left:50%;width:56px;height:30px;margin-left:-28px;border-radius:var(--radius-full);background:var(--color-primary-soft);transform:scaleX(.4);opacity:0;transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.tab.on{color:var(--color-primary);font-weight:600}
.tab.on::before{transform:scaleX(1);opacity:1}
.tab.on svg{stroke-width:2.1}
.tab:active{opacity:.8}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--space-3);padding:calc(var(--st) + 14px) var(--page-pad) 12px;background:color-mix(in srgb,var(--color-bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar h1{font-size:28px;line-height:34px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.topbar.sub h1{font-size:20px;line-height:26px;font-weight:650}
.pad{padding:4px var(--page-pad) calc(var(--space-8) + 56px)}
.icon-btn{width:var(--touch-target);height:var(--touch-target);flex:none;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);display:grid;place-items:center;padding:0;transition:background var(--dur),transform var(--dur)}
.icon-btn:active{transform:scale(.96);background:var(--color-surface-subtle)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--color-danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.quota{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0 2px}.quota i{width:10px;height:10px;border-radius:50%;background:var(--color-success);flex:none}.quota.warn i{background:var(--color-warning)}.quota.bad i{background:var(--color-danger)}
.dates{display:grid;gap:8px;margin:8px 0 14px}.dates label{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--color-text-secondary)}.dates label span{flex:none;width:56px}
.notif{display:block;width:100%;text-align:left;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:8px}.notif.new{border-color:var(--color-primary);box-shadow:inset 3px 0 0 var(--color-primary)}.notif b{display:block;font-weight:600}.notif span{font-size:14px;color:var(--color-text-secondary)}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:var(--control-height);padding:12px 16px;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-surface);font-weight:600;font-size:15px;line-height:20px;text-align:center;text-decoration:none;color:var(--color-text);transition:background var(--dur) var(--ease),border-color var(--dur),transform var(--dur),opacity var(--dur)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn+.btn{margin-top:var(--space-2)}
.btn:active{transform:scale(.985);background:var(--color-surface-subtle)}
.btn.primary{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary)}
.btn.primary:active{background:var(--color-primary-hover);border-color:var(--color-primary-hover)}
.btn.outline{background:transparent;border-color:var(--color-primary);color:var(--color-primary)}
.btn.danger{background:var(--color-danger);border-color:var(--color-danger);color:var(--color-on-danger)}
.btn.ghost{background:var(--color-surface)}
.btn.big{min-height:52px;font-size:16px}
.btn.small{display:inline-flex;width:auto;min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px;margin:0}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn.loading{pointer-events:none;color:transparent!important;position:relative}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid var(--color-on-primary);border-right-color:transparent;animation:spin .8s linear infinite}
.btn.ghost.loading::after{border-color:var(--color-primary);border-right-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
@media (hover:hover){.btn:hover{border-color:var(--color-border-strong)}.btn.primary:hover{background:var(--color-primary-hover);border-color:var(--color-primary-hover)}.icon-btn:hover{background:var(--color-surface-subtle)}}
.danger-text{color:var(--color-danger)!important}
.link{background:none;border:0;color:var(--color-primary);padding:6px 2px;font-size:15px;font-weight:500;min-height:32px}
.link.on{color:var(--color-text);font-weight:650}
.link.muted{color:var(--color-text-secondary)}
.fab{position:absolute;z-index:950;right:var(--page-pad);bottom:calc(var(--tabh) + var(--sb) + 16px);width:56px;height:56px;border-radius:var(--radius-xl);border:0;background:var(--color-primary);color:var(--color-on-primary);display:grid;place-items:center;box-shadow:var(--shadow-lg);transition:transform var(--dur)}
.fab:active{transform:scale(.95);background:var(--color-primary-hover)}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}

/* ---------- inputs ---------- */
label.f{display:block;font-size:14px;line-height:20px;color:var(--color-text);margin:16px 0 6px;font-weight:500}
.in{width:100%;min-height:var(--control-height);padding:12px 14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);font-size:16px;line-height:22px;transition:border-color var(--dur),box-shadow var(--dur)}
.in::placeholder{color:var(--color-text-disabled)}
.in:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--color-primary) 22%,transparent)}
.in:disabled{background:var(--color-surface-subtle);color:var(--color-text-disabled)}
.in.small{min-height:40px;padding:8px 10px;font-size:14px;border-radius:10px}
select.in{appearance:none;-webkit-appearance:none;padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--color-text-secondary) 50%),linear-gradient(135deg,var(--color-text-secondary) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea.in{min-height:84px;resize:vertical}
.sb-in:focus{outline:none}
.pin{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:600}
.err{color:var(--color-danger);font-size:14px;line-height:20px;min-height:20px;margin-top:8px}
.note{font-size:14px;line-height:20px;color:var(--color-text-secondary);background:var(--color-surface-subtle);border-radius:var(--radius-md);padding:12px 14px;margin:16px 0}
.hint{font-size:14px;line-height:20px;color:var(--color-info);background:var(--color-info-bg);border-radius:var(--radius-md);padding:10px 12px;margin:8px 0}
.hint .link{padding:0 2px;min-height:0}
.warnbox{font-size:14px;line-height:20px;color:var(--color-danger);background:var(--color-danger-bg);border-radius:var(--radius-md);padding:10px 12px;margin:10px 0}
.warnbox .link{color:inherit;text-decoration:underline;padding:0 2px;min-height:0}
.lang{margin-top:20px;font-size:14px;color:var(--color-text-secondary);text-align:center;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:flex;background:var(--color-surface-subtle);border-radius:var(--radius-md);padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;border-radius:10px;background:none;color:var(--color-text-secondary);font-size:14px;font-weight:500}
.seg button.on{background:var(--color-surface);color:var(--color-text);font-weight:600;box-shadow:var(--shadow-sm)}
h2.sec{font-size:18px;line-height:24px;font-weight:600;margin:24px 0 10px}
.tool-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.steppers{display:flex;gap:12px}.steppers>div{flex:1;min-width:0}
.stepper{display:flex;align-items:center;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);overflow:hidden;min-height:var(--control-height)}
.stepper button{width:44px;height:46px;border:0;background:none;font-size:22px;color:var(--color-primary);flex:none}
.stepper button:active{background:var(--color-primary-soft)}
.stepper button:disabled{color:var(--color-text-disabled)}
.stepper input{flex:1;min-width:0;width:100%;border:0;background:none;text-align:center;font-size:18px;font-weight:650;padding:0;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none}
.stepper:focus-within{border-color:var(--color-primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--color-primary) 22%,transparent)}
.stepper b{flex:1;text-align:center;font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}

/* search */
.searchbox{display:flex;align-items:center;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:0 12px;height:var(--control-height);transition:border-color var(--dur),box-shadow var(--dur)}
.searchbox:focus-within{border-color:var(--color-primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--color-primary) 22%,transparent)}
.sb-ic svg{width:20px;height:20px;fill:none;stroke:var(--color-text-secondary);stroke-width:2;stroke-linecap:round;display:block}
.sb-in{flex:1;min-width:0;border:0;background:none;padding:0 10px;height:100%;font-size:16px}
.sb-in::placeholder{color:var(--color-text-disabled)}
.results{background:var(--color-surface-elevated);border:1px solid var(--color-border);border-radius:var(--radius-md);margin-top:6px;overflow:hidden;box-shadow:var(--shadow-md);position:relative;z-index:30}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--color-border);padding:12px 14px;min-height:var(--touch-target)}
.res:last-child{border-bottom:0}.res:active{background:var(--color-surface-subtle)}
.res b{display:block;font-size:15px;font-weight:600}.res span{font-size:13px;color:var(--color-text-secondary)}

/* chips & status */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--color-surface-subtle);color:var(--color-text);border:1px solid transparent;border-radius:var(--radius-full);min-height:36px;padding:6px 8px 6px 12px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap}
.chip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip.on{background:var(--color-primary-soft);color:var(--color-primary);border-color:color-mix(in srgb,var(--color-primary) 45%,transparent);font-weight:600}
button.chip{cursor:pointer;padding:6px 14px;transition:background var(--dur),border-color var(--dur)}
button.chip:active{transform:scale(.97)}
button.chip:disabled{opacity:.45}
.chip button{border:0;background:none;color:var(--color-text-secondary);font-size:18px;line-height:1;padding:0 6px;min-height:32px;min-width:32px;margin:-4px -4px -4px 0}
.pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:8px;font-size:12px;line-height:16px;font-weight:600;padding:4px 10px 4px 8px;border-radius:var(--radius-full);background:var(--color-info-bg);color:var(--color-info);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.kpi{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:12px;min-width:0;text-align:left;box-shadow:var(--shadow-sm)}

.create-card{border:1px dashed color-mix(in srgb,var(--color-primary) 50%,var(--color-border));background:var(--color-primary-soft);padding:16px;margin-bottom:16px}

.worker-card{flex-direction:column;align-items:stretch;gap:12px}
.wc-main{display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:0;color:inherit;min-height:var(--touch-target)}
.wc-main b{display:block;font-size:16px;font-weight:600}.wc-main .grow>span{display:block;font-size:13px;line-height:18px;color:var(--color-text-secondary);margin-top:2px}.wc-main .grow>span .pill{margin-top:4px}.wc-main>svg{width:20px;height:20px;fill:none;stroke:var(--color-text-disabled);stroke-width:2}

/* person header */

.map-top .searchbox{box-shadow:var(--shadow-md);border-color:transparent;background:var(--color-surface-elevated)}
.map-btn{position:absolute;z-index:500;right:12px;top:calc(var(--st) + 12px);border-radius:50%}
.ahead-dot{width:12px;height:12px;box-sizing:border-box;background:#fff;border:3px solid var(--color-primary);border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.legal h1{font-size:24px;line-height:30px;margin:14px 0 4px}.legal h2{font-size:17px;line-height:24px;margin:22px 0 6px}.legal p,.legal li{font-size:14.5px;line-height:1.55}.legal ul{padding-left:20px}.legal a{color:var(--color-primary)}
.legal-in-modal{max-height:55vh;overflow:auto;margin:6px 0 12px;padding-right:4px}.note-list{padding-left:20px;margin:8px 0}.note-list li{margin:6px 0;line-height:1.45}.legal-links{margin-top:24px}
.rv{position:absolute;inset:0;background:var(--color-bg)}
.rv-back{position:absolute;z-index:700;left:12px;top:calc(var(--st) + 12px);box-shadow:var(--shadow-md);border-color:transparent;background:var(--color-surface-elevated)}
.rv-card{position:absolute;z-index:650;left:64px;right:12px;top:calc(var(--st) + 10px);max-width:440px;max-height:45vh;overflow:auto;background:var(--color-surface-elevated);border-radius:var(--radius-lg);padding:12px 16px 14px;box-shadow:var(--shadow-md)}
.rv-title{display:block;font-size:18px;line-height:24px;font-weight:600}.rv-line{color:var(--color-text-secondary);font-size:13px;line-height:18px;margin-top:2px}
.rv-stats{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px}.rv-stats div{display:flex;flex-direction:column}.rv-stats span{font-size:12px;line-height:16px;color:var(--color-text-secondary)}.rv-stats b{font-size:16px;line-height:22px;font-weight:650;font-variant-numeric:tabular-nums}
.rv-legend{margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}.rv-legend .lg{display:flex;align-items:center;gap:8px}.rv-legend .lg b{font-weight:600}.rv-legend .lg span{color:var(--color-text-secondary);margin-left:auto;white-space:nowrap;font-size:13px}.rv-legend i{flex:0 0 18px;height:5px;border-radius:3px}
.rv-note{margin-top:8px;font-size:13px;color:var(--color-text-secondary)}

.rv.clean .rv-card,.rv.clean .rv-back,.rv.clean .rv-tools .chip:not(#rvClean){display:none}.rv.clean #rvClean{opacity:.55}

.content:has(.sheet.tall) .pick-btn{display:none}
.float-card{position:absolute;z-index:600;left:12px;right:12px;bottom:12px;background:var(--color-surface-elevated);border-radius:var(--radius-xl);padding:16px;box-shadow:var(--shadow-lg);max-height:62%;overflow:auto}

.fc-head{margin-bottom:12px}
.fc-title{font-weight:600;margin-top:6px}
.stats{display:flex;gap:8px;margin:12px 0 10px}
.stats div{flex:1;min-width:0;background:var(--color-surface-subtle);border-radius:var(--radius-md);padding:10px 12px}
.stats span{display:block;font-size:12px;line-height:16px;color:var(--color-text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rec{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--color-danger)}
.rec::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--color-danger);animation:blink 1.4s infinite}
.rec.paused{color:var(--color-warning)}.rec.paused::before{background:var(--color-warning);animation:none}
@keyframes blink{50%{opacity:.25}}

.gps svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gps.ok{background:var(--color-success-bg);color:var(--color-success)}.gps.warn{background:var(--color-warning-bg);color:var(--color-warning)}.gps.bad{background:var(--color-danger-bg);color:var(--color-danger)}

/* bottom sheet (order creation) */
.sheet{position:absolute;z-index:600;left:0;right:0;bottom:0;background:var(--color-surface-elevated);border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:var(--shadow-lg);padding:8px var(--page-pad) 18px;max-height:48%;overflow:auto;transition:max-height .22s var(--ease),opacity var(--dur)}

.sheet.calc{opacity:.75}
.cbusy{position:absolute;right:16px;top:8px;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-secondary);background:var(--color-surface-subtle);padding:3px 10px;border-radius:var(--radius-full)}
.cbusy::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--color-primary);border-right-color:transparent;animation:spin .8s linear infinite}
/* steps of the order wizard */
.filters{margin:0 0 12px;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface);padding:0 14px}

.filters[open] summary{border-bottom:1px solid var(--color-border)}.filters .f-body{padding:2px 0 14px}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 10px}.sec-row h2{margin:0;font-size:18px;line-height:24px;font-weight:600}.sec-row span{font-size:13px;color:var(--color-text-secondary)}
.wz{display:flex;gap:4px;margin:0 0 12px}
.wz button{flex:1;min-width:0;border:0;background:none;padding:0;display:flex;flex-direction:column;gap:6px;align-items:stretch;color:var(--color-text-secondary);font-size:11.5px;line-height:14px;font-weight:500;text-align:left}
.wz button i{display:block;height:4px;border-radius:2px;background:var(--color-surface-subtle)}
.wz button.done i{background:color-mix(in srgb,var(--color-primary) 45%,var(--color-surface-subtle))}
.wz button.on{color:var(--color-primary);font-weight:650}.wz button.on i{background:var(--color-primary)}
.wz button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wz-title{font-size:18px;line-height:24px;font-weight:600;margin:0 0 2px}
.wz-nav{display:flex;gap:8px;margin-top:16px;position:sticky;bottom:-18px;background:var(--color-surface-elevated);padding:10px 0 14px}
.wz-nav .btn{margin:0}.wz-nav .btn.ghost{flex:0 0 34%}
.review{background:var(--color-surface-subtle);border-radius:var(--radius-md);padding:4px 14px;margin-top:8px}
.review>div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--color-border);font-size:14px}.review>div:last-child{border-bottom:0}
.review span{color:var(--color-text-secondary)}.review b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}

/* map markers */
.person{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}.person.on{background:#16A34A;box-shadow:0 0 0 8px rgba(22,163,74,.2),0 2px 8px rgba(0,0,0,.35)}.person.off{background:#64748B}.pin-label small{font-weight:400;opacity:.8}.pin-wrap:has(small) .pin-label{top:-48px}
.wmap{height:280px;border-radius:var(--radius-lg);overflow:hidden;margin:8px 0 8px;border:1px solid var(--color-border)}
button.rbtn{width:100%;background:none;border:0;border-bottom:1px solid var(--color-border);color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:var(--touch-target)}button.rbtn.sel{background:var(--color-primary-soft);border-radius:10px}button.rbtn:active{background:var(--color-surface-subtle)}
.wc-days{margin:2px 0 0;border-top:1px solid var(--color-border)}.wc-days .rbtn{padding:10px 4px}
.rb-main{display:flex;flex-direction:column;gap:2px;min-width:0}.rb-main b{font-weight:600;font-size:14px}.rb-main small{color:var(--color-text-secondary);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button.rbtn>span{white-space:nowrap;align-self:center;font-size:13px}
.start-dot{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid #16A34A}.end-dot{width:16px;height:16px;border-radius:4px;background:#0F172A;border:3px solid #fff}
.map-search{position:absolute;z-index:700;left:12px;right:12px;top:calc(var(--st) + 12px)}.map-search .searchbox{box-shadow:var(--shadow-md);border-color:transparent;background:var(--color-surface-elevated)}.map-search .results{margin-top:6px;max-height:40vh;overflow:auto}
.rad-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}.rad-row.hidden{display:none}.rad-city{background:var(--color-surface-elevated);border-radius:var(--radius-full);padding:7px 12px;font-size:14px;box-shadow:var(--shadow-md)}.rad-row .chip{box-shadow:var(--shadow-md);background:var(--color-surface-elevated)}.rad-row .chip.on{background:var(--color-primary);color:var(--color-on-primary);border-color:var(--color-primary)}
.me-dot{width:20px;height:20px;border-radius:50%;background:#2563EB;border:3px solid #fff;box-shadow:0 0 0 2px #2563EB,0 0 0 9px rgba(37,99,235,.18)}
.pin-start{width:24px;height:24px;border-radius:50%;background:var(--color-primary);border:4px solid #fff;box-shadow:0 0 0 2px var(--color-primary),0 2px 8px rgba(0,0,0,.3)}

/* ---------- feedback ---------- */
.modal{position:fixed;inset:0;background:var(--color-scrim);z-index:2000;display:flex;align-items:flex-end;justify-content:center;animation:fade var(--dur) var(--ease)}
.modal-box{background:var(--color-surface-elevated);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:24px var(--page-pad) calc(var(--sb) + 20px);animation:rise .22s var(--ease)}

@media (min-width:768px){.modal{align-items:center}.modal-box{border-radius:var(--radius-xl)}}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(24px);opacity:.6}}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--sb) + 18px);transform:translate(-50%,20px);opacity:0;background:var(--color-text);color:var(--color-surface);padding:12px 16px;border-radius:var(--radius-md);font-size:14px;font-weight:500;z-index:3000;transition:all var(--dur) var(--ease);max-width:calc(100% - 32px);box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.offline{position:fixed;z-index:2500;left:12px;right:12px;top:calc(var(--st) + 8px);display:flex;align-items:center;gap:8px;background:var(--color-warning-bg);color:var(--color-warning);border:1px solid color-mix(in srgb,var(--color-warning) 35%,transparent);border-radius:var(--radius-md);padding:10px 12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-md)}
.offline svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
