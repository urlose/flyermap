<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>FlyerMap</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FlyerMap">
<meta name="theme-color" content="#0E9F8E">
<link rel="stylesheet" href="leaflet.css">
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --ink:#17202B; --muted:#5F6B7A; --line:#E1E5EA; --soft:#EEF1F4;
  --brand:#0E9F8E; --brand-ink:#FFFFFF; --route:#C2185B; --live:#2563EB; --green:#16A34A; --danger:#C62828;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom); --tabh:64px;
  --shadow:0 6px 24px rgba(23,32,43,.14);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0F141A; --card:#19212B; --ink:#E8EDF2; --muted:#9AA6B4; --line:#2A3441; --soft:#222C37; --brand:#2CC9B5; --brand-ink:#05211D; --route:#F06292; --live:#60A5FA; --shadow:0 6px 24px rgba(0,0,0,.5); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
button{cursor:pointer}
a{color:var(--live)}
.hidden{display:none!important}
#root{position:fixed;inset:0}

/* ---------- plain screens (welcome / auth) ---------- */
.plain{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.plain-in{max-width:460px;margin:0 auto;padding:calc(var(--st) + 24px) 20px calc(var(--sb) + 28px)}
.welcome{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center}
.logo img{width:72px;height:72px;border-radius:18px;display:block;margin-bottom:18px}
.hero{font-size:30px;line-height:1.15;letter-spacing:-.01em;margin:8px 0 8px}
.back-link{padding:6px 0;margin-bottom:6px}

/* ---------- shell with tab bar ---------- */
.shell{position:absolute;inset:0;display:flex;flex-direction:column}
.content{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.content.map-content{overflow:hidden}
.tabbar{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sb);position:relative;z-index:900}
.tab{flex:1;height:var(--tabh);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:600;position:relative}
.tab+.tab::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:1px;background:var(--line)}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--brand)}
.tab.on svg{stroke-width:2.2}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 10px) 16px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar h1{font-size:24px;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad{padding:4px 16px 28px}
.icon-btn{width:42px;height:42px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.pill.warn{--pc:#D97706}.pill.bad{--pc:var(--danger)}
.quota{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0 2px}.quota i{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}.quota.warn i{background:#D97706}.quota.bad i{background:var(--danger)}
.rec.paused{color:#D97706}.rec.paused::before{background:#D97706;animation:none}
.dates{display:grid;gap:8px;margin:8px 0 14px}.dates label{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}.dates label span{flex:none;width:52px}
.notif{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}.notif.new{border-color:var(--brand)}.notif b{display:block}.notif span{font-size:14px;color:var(--muted)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- controls ---------- */
.btn{display:block;width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:650;font-size:16.5px;text-align:center;text-decoration:none;color:var(--ink)}
.btn+.btn{margin-top:10px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:var(--card)}
.btn.big{padding:17px;font-size:17.5px}
.btn.small{display:inline-block;width:auto;padding:8px 12px;font-size:14px;border-radius:11px;margin:0}
.btn:disabled{opacity:.5}
.danger-text{color:var(--danger)!important}
.link{background:none;border:0;color:var(--live);padding:6px 2px;font-size:15px}
.link.on{color:var(--ink);font-weight:650}
label.f{display:block;font-size:13.5px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.in{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16.5px}
.in.small{padding:9px 10px;font-size:14.5px;border-radius:10px}
textarea.in{min-height:72px;resize:vertical}
.in:focus,.sb-in:focus{outline:none}
.searchbox:focus-within{outline:2px solid var(--live)}
.pin{letter-spacing:.5em;text-align:center;font-size:22px}
.err{color:var(--danger);font-size:14.5px;min-height:20px;margin-top:8px}
.muted{color:var(--muted)} .small{font-size:13.5px} .center{text-align:center}
.note{font-size:13.5px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;margin:14px 0}
.hint{font-size:14px;background:var(--soft);border-radius:12px;padding:9px 12px;margin:8px 0}
.lang{margin-top:18px;font-size:14px;color:var(--muted);text-align:center}
h2.sec{font-size:17px;margin:22px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:20px;padding:6px 8px 6px 12px;font-size:14.5px}
.chip.on{background:var(--brand);color:var(--brand-ink)}
button.chip{border:0;cursor:pointer;padding:6px 12px}
.chip button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
.tool-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.steppers{display:flex;gap:12px}.steppers>div{flex:1}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.stepper button{width:46px;height:46px;border:0;background:none;font-size:22px;color:var(--brand)}
.stepper button:disabled{color:var(--muted);opacity:.5}
.stepper input{flex:1;min-width:0;width:100%;border:0;background:none;text-align:center;font-size:18px;font-weight:700;padding:0;-moz-appearance:textfield}
.stepper input:focus{outline:none}
.stepper:focus-within{outline:2px solid var(--live)}
.warnbox{font-size:14px;background:color-mix(in srgb,var(--danger) 12%,var(--card));border:1px solid color-mix(in srgb,var(--danger) 35%,var(--line));border-radius:12px;padding:10px 12px;margin:10px 0}
.stepper b{flex:1;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}

/* search */
.searchbox{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:48px}
.sb-ic svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;display:block}
.sb-in{flex:1;border:0;background:none;padding:0 10px;height:100%;font-size:16.5px;border-radius:10px}
.results{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:6px;overflow:hidden;box-shadow:var(--shadow);position:relative;z-index:30}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px}
.res:last-child{border-bottom:0}
.res b{display:block;font-size:15.5px}.res span{font-size:13px;color:var(--muted)}

/* cards & lists */
.card{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px;margin-bottom:10px;text-align:left}
.card svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2;flex:none}
.tc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tc-main b{font-size:17px}.tc-main>span{font-size:14px;color:var(--muted)}
.pill{align-self:flex-start;margin-top:6px;font-size:12.5px;font-weight:650;padding:3px 9px;border-radius:20px;background:color-mix(in srgb,var(--pc,#2563EB) 14%,transparent);color:var(--pc,#2563EB)}
.pill.live{--pc:var(--green)}
.create-card{border:2px dashed color-mix(in srgb,var(--brand) 55%,var(--line));background:color-mix(in srgb,var(--brand) 6%,var(--card));padding:18px 16px;margin-bottom:16px}
.create-card b{display:block;font-size:19px}.create-card span{font-size:14px;color:var(--muted)}
.cc-ic{width:46px;height:46px;border-radius:14px;background:var(--brand);display:grid;place-items:center;flex:none}
.cc-ic svg{stroke:var(--brand-ink)!important;width:24px!important;height:24px!important;stroke-width:2.4!important}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:18px;color:var(--muted)}
.worker-card{flex-direction:column;align-items:stretch;gap:10px}
.wc-main{display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:0}
.wc-main b{display:block;font-size:16.5px}.wc-main span{font-size:13.5px;color:var(--muted)}
.wc-act{display:flex;gap:8px}
.row-line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.row-line span{color:var(--muted)}

/* person header (sketch) */
.person-row{display:flex;align-items:center;gap:12px;padding:6px 0 14px;border-bottom:1px solid var(--line)}
.person-row b{display:block;font-size:18px}.person-row span{font-size:14px;color:var(--muted)}
.person-row.big b{font-size:20px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;position:relative}
.avatar svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.avatar.live::after{content:"";position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid var(--card)}

/* task info (sketch) */
.info{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.info>div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.info>div:last-child{border-bottom:0}
.info span{color:var(--muted);font-size:14.5px;flex:none}.info b{font-weight:600;text-align:right;font-size:15px}
.mapbox{height:260px;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin:14px 0}

/* route rows */
.route-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.route-row .grow{flex:1;min-width:0}.route-row b{display:block;font-size:15.5px}.route-row .grow>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px}
.swatch{width:14px;height:14px;border-radius:4px;flex:none;margin-top:4px}
.rr-act{display:flex;gap:8px;align-items:center;margin-top:8px}.rr-act select{flex:1}
.bar{height:6px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:4px;transition:width .4s}
.grow{flex:1;min-width:0}

/* full screen maps */
.fullmap{position:absolute;inset:0}
.map-top{position:absolute;z-index:500;left:12px;right:12px;top:calc(var(--st) + 10px);display:flex;gap:8px;align-items:flex-start}
.map-top .icon-btn{box-shadow:var(--shadow)}
.map-top .searchbox{box-shadow:var(--shadow);border-color:transparent}
.map-btn{position:absolute;z-index:500;right:12px;top:calc(var(--st) + 12px);box-shadow:var(--shadow)}
.float-card{position:absolute;z-index:600;left:12px;right:12px;bottom:12px;background:var(--card);border-radius:20px;padding:14px 16px 14px;box-shadow:var(--shadow);max-height:62%;overflow:auto}
.fc-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fc-head b{display:block;font-size:18px}.fc-head span{font-size:14px;color:var(--muted)}
.fc-head{margin-bottom:12px}
.fc-title{font-weight:650;margin-top:4px}
.stats{display:flex;gap:8px;margin:12px 0 10px}
.stats div{flex:1;background:var(--soft);border-radius:14px;padding:9px 11px}
.stats span{display:block;font-size:12.5px;color:var(--muted)}
.stats b{font-size:22px;font-variant-numeric:tabular-nums}
.rec{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--danger)}
.rec::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.rec::before{animation:none}}
.sync{font-size:12.5px;color:var(--muted);margin-top:8px;text-align:center}
.live-list{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.live-chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 12px;font-size:14px}
.dotc{width:9px;height:9px;border-radius:50%;background:var(--green)}.dotc.warn{background:#D97706}.dotc.bad{background:var(--danger)}.dotc.pause{background:var(--muted)}

/* bottom sheet for route creation */
.sheet{position:absolute;z-index:600;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;box-shadow:var(--shadow);padding:10px 16px 18px;max-height:44%;overflow:auto;transition:max-height .25s}
.sheet.tall{max-height:86%}
.sheet-grip{display:block;width:100%;height:22px;border:0;background:none;padding:0;margin:0 0 4px;position:sticky;top:-10px}
.sheet-grip::after{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}

/* map markers */
.person{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}.person.on{background:var(--green);box-shadow:0 0 0 8px rgba(22,163,74,.2),0 2px 8px rgba(0,0,0,.35)}.person.off{background:#64748B}.pin-label small{font-weight:400;opacity:.8}.pin-wrap:has(small) .pin-label{top:-48px}
.wmap{height:280px;border-radius:14px;overflow:hidden;margin:8px 0 6px;border:1px solid var(--line)}button.rbtn{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;text-align:left;cursor:pointer}button.rbtn.sel{background:var(--card);border-radius:10px}
.start-dot{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--green)}.end-dot{width:16px;height:16px;border-radius:4px;background:#0F172A;border:3px solid #fff}
.map-search{position:absolute;z-index:700;left:12px;right:12px;top:12px}.map-search .searchbox{box-shadow:var(--shadow)}.map-search .results{margin-top:6px;box-shadow:var(--shadow);max-height:40vh;overflow:auto}.rad-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}.rad-row.hidden{display:none}.rad-city{background:var(--card);border-radius:20px;padding:6px 12px;font-size:14px;box-shadow:var(--shadow)}.rad-row .chip{box-shadow:var(--shadow);background:var(--card)}.rad-row .chip.on{background:var(--brand);color:var(--brand-ink)}
.me-dot{width:20px;height:20px;border-radius:50%;background:var(--live);border:3px solid #fff;box-shadow:0 0 0 2px var(--live),0 0 0 9px rgba(37,99,235,.18)}
.pin-start{width:24px;height:24px;border-radius:50%;background:var(--brand);border:4px solid #fff;box-shadow:0 0 0 2px var(--brand),0 2px 8px rgba(0,0,0,.3)}
.pin-wrap{position:relative}
.pin-label{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:var(--card);color:var(--ink);font-size:12.5px;font-weight:650;padding:3px 8px;border-radius:8px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.leaflet-control-attribution{font-size:10px}
.leaflet-container{background:var(--soft);font:inherit}

/* dialogs */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 18px calc(var(--sb) + 18px)}
.modal-box h2{margin-top:0}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--sb) + 18px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:3000;transition:all .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
